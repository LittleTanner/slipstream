name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract the sim from index.html
        run: node tools/extract.js
      - name: Verify against the golden master (1590 checks)
        run: node tools/verify.js
