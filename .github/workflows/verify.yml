name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract the sim from index.html
        run: node tools/extract.js
      - name: Mechanics suite (one test per mechanic promise)
        run: node tools/tests/run.js
      - name: Verify against the golden master (1590 checks)
        run: node tools/verify.js
      # Keeps the iOS conformance fixtures honest. They must be regenerated with the golden,
      # and a stale fixture is worse than none: a Swift port would chase a divergence from a
      # sim that no longer exists. Seconds to run. See docs/PORT.md.
      - name: iOS conformance fixtures are current (port/)
        run: node tools/port-verify.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Smoke suite (every screen, every drill, a full race, the pause card)
        run: python3 tools/browser/smoke.py
      - name: Career suite (division, pricing ladder, money, result recording)
        run: python3 tools/browser/career.py
